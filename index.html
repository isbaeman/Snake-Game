<style>

<body>

<canvas id="game"></canvas>

<!-- HUD -->
<div id="hud">

    <div class="score-box">

        </div>

        </div>

</div>

<!-- SCORE POP -->
<div id="scorePop">+1</div>

<!-- START SCREEN -->
<section class="overlay" id="startScreen">

    <div class="panel">

        <h1 class="title">

        </h1>

        <p class="description">
            Eat the golden balls.
        </p>

        <p class="description">
            Move your mouse or drag<br>
            your finger to control the snake.
        </p>

        <button class="start-button" id="startBtn">
            START
        </button>

        <div class="hint">
            MOUSE + TOUCH CONTROL
        </div>

    </div>

</section>

<!-- GAME OVER -->
<section class="overlay hidden" id="gameOver">

    <div class="panel">

        <h1 class="title">
            GAME OVER
        </h1>

        <p class="description">
            SCORE
            <strong id="finalScore">0000</strong>
        </p>

        <p class="description">
            HIGH SCORE
            <strong id="finalHigh">0000</strong>
        </p>

        <button class="start-button" id="againBtn">
            PLAY AGAIN
        </button>

    </div>

</section>

<script>
(() => {

"use strict";

/* =========================================================
   ELEMENTS
========================================================= */

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const scoreEl = document.getElementById("score");
const highEl = document.getElementById("high");

const startScreen = document.getElementById("startScreen");
const gameOverScreen = document.getElementById("gameOver");

const startBtn = document.getElementById("startBtn");
const againBtn = document.getElementById("againBtn");

const muteBtn = document.getElementById("mute");

const finalScore = document.getElementById("finalScore");
const finalHigh = document.getElementById("finalHigh");

const scorePop = document.getElementById("scorePop");


/* =========================================================
   CANVAS
========================================================= */

let W = window.innerWidth;
let H = window.innerHeight;
let dpr = 1;


/* =========================================================
   GAME STATE
========================================================= */

let gameState = "menu";

let snake = [];
let food = null;
let particles = [];

let score = 0;
let highScore = 0;

let lastTime = 0;

let pulse = 0;

let snakeSpeed = 170;

let growth = 0;


/* =========================================================
   POINTER
========================================================= */

const pointer = {
    x: W / 2,
    y: H / 2,
    active: false
};


/* =========================================================
   SNAKE MOVEMENT
========================================================= */

let headAngle = 0;

const TURN_SPEED = 8;


/* =========================================================
   AUDIO
========================================================= */

let audioContext = null;
let soundEnabled = true;


/* =========================================================
   STORAGE
========================================================= */

try {

    highScore =
        Number(localStorage.getItem("blackSnakeHighScore")) || 0;

} catch (error) {

    highScore = 0;

}

try {

    soundEnabled =
        localStorage.getItem("blackSnakeSound") !== "0";

} catch (error) {

    soundEnabled = true;

}

muteBtn.textContent = soundEnabled ? "🔊" : "🔇";

updateScoreDisplay();


/* =========================================================
   RESIZE
========================================================= */

function resizeCanvas() {

    W = window.innerWidth;
    H = window.innerHeight;

    dpr = Math.min(window.devicePixelRatio || 1, 2);

    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);

    canvas.style.width = W + "px";
    canvas.style.height = H + "px";

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    if (!pointer.active) {

        pointer.x = W / 2;
        pointer.y = H / 2;

    }

}

window.addEventListener("resize", resizeCanvas);


/* =========================================================
   POINTER POSITION
========================================================= */

function updatePointer(x, y) {

    pointer.x = x;
    pointer.y = y;
    pointer.active = true;

}


/* =========================================================
   MOUSE CONTROL
========================================================= */

canvas.addEventListener("mousemove", event => {

    updatePointer(
        event.clientX,
        event.clientY
    );

});


/* =========================================================
   TOUCH CONTROL
========================================================= */

canvas.addEventListener(
    "touchstart",
    event => {

        event.preventDefault();

        const touch = event.touches[0];

        if (!touch) return;

        updatePointer(
            touch.clientX,
            touch.clientY
        );

    },
    { passive: false }
);


canvas.addEventListener(
    "touchmove",
    event => {

        event.preventDefault();

        const touch = event.touches[0];

        if (!touch) return;

        updatePointer(
            touch.clientX,
            touch.clientY
        );

    },
    { passive: false }
);


/* =========================================================
   AUDIO
========================================================= */

function initAudio() {

    if (!soundEnabled) return;

    try {

        if (!audioContext) {

            const AudioCtx =
                window.AudioContext ||
                window.webkitAudioContext;

            if (!AudioCtx) return;

            audioContext = new AudioCtx();

        }

        if (audioContext.state === "suspended") {

            audioContext.resume();

        }

    } catch (error) {}

}


function playTone(
    frequency,
    duration = 0.08,
    delay = 0,
    type = "sine",
    volume = 0.025
) {

    if (!soundEnabled || !audioContext) return;

    try {

        const oscillator =
            audioContext.createOscillator();

        const gain =
            audioContext.createGain();

        const time =
            audioContext.currentTime + delay;

        oscillator.type = type;

        oscillator.frequency.setValueAtTime(
            frequency,
            time
        );

        gain.gain.setValueAtTime(
            volume,
            time
        );

        gain.gain.exponentialRampToValueAtTime(
            0.0001,
            time + duration
        );

        oscillator
            .connect(gain)
            .connect(audioContext.destination);

        oscillator.start(time);

        oscillator.stop(time + duration + 0.01);

    } catch (error) {}

}


function startSound() {

    playTone(380, 0.07, 0, "sine", 0.03);

    playTone(
        620,
        0.1,
        0.08,
        "sine",
        0.03
    );

}


function eatSound() {

    playTone(
        700,
        0.06,
        0,
        "triangle",
        0.035
    );

    playTone(
        1050,
        0.08,
        0.055,
        "triangle",
        0.025
    );

}


function gameOverSound() {

    playTone(
        400,
        0.12,
        0,
        "sine",
        0.03
    );

    playTone(
        240,
        0.18,
        0.12,
        "sine",
        0.025
    );

}


/* =========================================================
   START GAME
========================================================= */

function startGame() {

    initAudio();

    resetGame();

    gameState = "playing";

    startScreen.classList.add("hidden");
    gameOverScreen.classList.add("hidden");

    lastTime = performance.now();

    startSound();

}


/* =========================================================
   RESET GAME
========================================================= */

function resetGame() {

    score = 0;

    growth = 0;

    particles = [];

    headAngle = 0;

    snakeSpeed = 170;

    const startX = W / 2;
    const startY = H / 2;

    snake = [];

    const initialLength = 35;

    for (let i = 0; i < initialLength; i++) {

        snake.push({
            x: startX - i * 7,
            y: startY
        });

    }

    pointer.x = startX + 120;
    pointer.y = startY;

    pointer.active = true;

    spawnGoldenBall();

    updateScoreDisplay();

}


/* =========================================================
   SCORE
========================================================= */

function updateScoreDisplay() {

    scoreEl.textContent =
        String(score).padStart(4, "0");

    highEl.textContent =
        String(highScore).padStart(4, "0");

}


function saveHighScore() {

    if (score > highScore) {

        highScore = score;

        try {

            localStorage.setItem(
                "blackSnakeHighScore",
                String(highScore)
            );

        } catch (error) {}

    }

}


/* =========================================================
   GOLDEN BALL
========================================================= */

function spawnGoldenBall() {

    let x;
    let y;

    let attempts = 0;

    do {

        x = 45 + Math.random() * (W - 90);

        y = 80 + Math.random() * (H - 130);

        attempts++;

    } while (

        attempts < 100 &&
        snake.some(
            segment =>
                Math.hypot(
                    segment.x - x,
                    segment.y - y
                ) < 70
        )

    );

    food = {

        x,
        y,

        radius: 8,

        phase:
            Math.random() *
            Math.PI *
            2

    };

}


/* =========================================================
   GROW SNAKE
========================================================= */

function growSnake() {

    growth += 7;

}


/* =========================================================
   FOOD COLLISION
========================================================= */

function checkFoodCollision() {

    if (!food || !snake.length) return;

    const head = snake[0];

    const distance =
        Math.hypot(
            head.x - food.x,
            head.y - food.y
        );

    if (distance < 18) {

        createParticles(
            food.x,
            food.y
        );

        score++;

        growSnake();

        saveHighScore();

        updateScoreDisplay();

        eatSound();

        showScorePopup(
            food.x,
            food.y
        );

        /*
         * Gradually increase speed.
         */
        snakeSpeed =
            Math.min(
                300,
                170 + score * 3
            );

        spawnGoldenBall();

    }

}


/* =========================================================
   SCORE POPUP
========================================================= */

function showScorePopup(x, y) {

    scorePop.style.left =
        (x + 12) + "px";

    scorePop.style.top =
        (y - 12) + "px";

    scorePop.animate(
        [
            {
                opacity: 1,
                transform:
                    "translateY(0) scale(1)"
            },

            {
                opacity: 0,
                transform:
                    "translateY(-28px) scale(1.15)"
            }
        ],
        {
            duration: 550,
            easing: "ease-out"
        }
    );

}


/* =========================================================
   PARTICLES
========================================================= */

function createParticles(x, y) {

    for (let i = 0; i < 24; i++) {

        const angle =
            Math.random() *
            Math.PI *
            2;

        const velocity =
            50 +
            Math.random() *
            150;

        particles.push({

            x,
            y,

            vx:
                Math.cos(angle) *
                velocity,

            vy:
                Math.sin(angle) *
                velocity,

            radius:
                1 +
                Math.random() *
                2.5,

            life:
                0.4 +
                Math.random() *
                0.4,

            maxLife:
                0.8

        });

    }

}


function updateParticles(dt) {

    for (
        let i = particles.length - 1;
        i >= 0;
        i--
    ) {

        const p = particles[i];

        p.x += p.vx * dt;
        p.y += p.vy * dt;

        p.vx *= Math.pow(0.08, dt);
        p.vy *= Math.pow(0.08, dt);

        p.life -= dt;

        if (p.life <= 0) {

            particles.splice(i, 1);

        }

    }

}


/* =========================================================
   SMOOTH ANGLE
========================================================= */

function angleDifference(a, b) {

    return Math.atan2(
        Math.sin(a - b),
        Math.cos(a - b)
    );

}


/* =========================================================
   UPDATE SNAKE
========================================================= */

function update(dt) {

    if (gameState !== "playing") return;

    pulse += dt;

    const head = snake[0];

    /*
     * Find angle from snake head
     * to mouse/finger.
     */
    if (pointer.active) {

        const dx =
            pointer.x - head.x;

        const dy =
            pointer.y - head.y;

        const targetAngle =
            Math.atan2(dy, dx);

        const difference =
            angleDifference(
                targetAngle,
                headAngle
            );

        /*
         * Smooth steering.
         */
        headAngle +=
            difference *
            Math.min(
                1,
                TURN_SPEED * dt
            );

    }

    /*
     * Move head continuously.
     */
    head.x +=
        Math.cos(headAngle) *
        snakeSpeed *
        dt;

    head.y +=
        Math.sin(headAngle) *
        snakeSpeed *
        dt;


    /*
     * Boundary collision.
     *
     * Give a small margin so
     * the snake does not disappear.
     */
    const margin = 8;

    if (
        head.x < margin ||
        head.x > W - margin ||
        head.y < margin ||
        head.y > H - margin
    ) {

        gameOver();

        return;

    }


    /*
     * Body follows head.
     */
    const bodyGap = 6.5;

    for (
        let i = 1;
        i < snake.length;
        i++
    ) {

        const previous =
            snake[i - 1];

        const segment =
            snake[i];

        const dx =
            previous.x -
            segment.x;

        const dy =
            previous.y -
            segment.y;

        const distance =
            Math.hypot(dx, dy);

        if (distance > bodyGap) {

            const ratio =
                Math.min(
                    1,
                    dt * 22
                );

            segment.x +=
                (dx / distance) *
                (distance - bodyGap) *
                ratio;

            segment.y +=
                (dy / distance) *
                (distance - bodyGap) *
                ratio;

        }

    }


    /*
     * Grow snake.
     */
    if (growth > 0) {

        const tail =
            snake[snake.length - 1];

        snake.push({

            x: tail.x,
            y: tail.y

        });

        growth--;

    }


    checkSelfCollision();

    checkFoodCollision();

    updateParticles(dt);

}


/* =========================================================
   SELF COLLISION
========================================================= */

function checkSelfCollision() {

    if (snake.length < 35) return;

    const head = snake[0];

    /*
     * Ignore the first part of the body
     * because it is naturally very close
     * to the head.
     */
    for (
        let i = 18;
        i < snake.length;
        i++
    ) {

        const segment = snake[i];

        const distance =
            Math.hypot(
                head.x - segment.x,
                head.y - segment.y
            );

        if (distance < 8) {

            gameOver();

            return;

        }

    }

}


/* =========================================================
   GAME OVER
========================================================= */

function gameOver() {

    if (gameState === "over") return;

    gameState = "over";

    saveHighScore();

    updateScoreDisplay();

    finalScore.textContent =
        String(score).padStart(4, "0");

    finalHigh.textContent =
        String(highScore).padStart(4, "0");

    gameOverScreen.classList.remove(
        "hidden"
    );

    gameOverSound();

}


/* =========================================================
   BACKGROUND
========================================================= */

function drawBackground() {

    ctx.fillStyle = "#0b0b0b";

    ctx.fillRect(
        0,
        0,
        W,
        H
    );


    /*
     * Soft center light.
     */
    const gradient =
        ctx.createRadialGradient(
            W / 2,
            H / 2,
            0,
            W / 2,
            H / 2,
            Math.max(W, H) * 0.7
        );

    gradient.addColorStop(
        0,
        "rgba(45,45,45,0.28)"
    );

    gradient.addColorStop(
        0.55,
        "rgba(18,18,18,0.14)"
    );

    gradient.addColorStop(
        1,
        "rgba(0,0,0,0.8)"
    );

    ctx.fillStyle = gradient;

    ctx.fillRect(
        0,
        0,
        W,
        H
    );

}


/* =========================================================
   GOLDEN BALL
========================================================= */

function drawGoldenBall() {

    if (!food) return;

    const animatedRadius =
        food.radius +
        Math.sin(
            pulse * 3 +
            food.phase
        ) *
        1.3;


    ctx.save();

    /*
     * Golden glow.
     */
    ctx.shadowColor =
        "rgba(255,215,0,0.9)";

    ctx.shadowBlur = 25;


    /*
     * Golden radial gradient.
     */
    const gradient =
        ctx.createRadialGradient(
            food.x - 2,
            food.y - 3,
            1,
            food.x,
            food.y,
            animatedRadius * 2
        );

    gradient.addColorStop(
        0,
        "#fff8c4"
    );

    gradient.addColorStop(
        0.3,
        "#ffd700"
    );

    gradient.addColorStop(
        0.7,
        "#e7aa00"
    );

    gradient.addColorStop(
        1,
        "#8f6500"
    );


    ctx.fillStyle = gradient;

    ctx.beginPath();

    ctx.arc(
        food.x,
        food.y,
        animatedRadius,
        0,
        Math.PI * 2
    );

    ctx.fill();


    /*
     * Highlight.
     */
    ctx.shadowBlur = 0;

    ctx.fillStyle =
        "rgba(255,255,255,0.85)";

    ctx.beginPath();

    ctx.arc(
        food.x - 2.5,
        food.y - 3,
        animatedRadius * 0.22,
        0,
        Math.PI * 2
    );

    ctx.fill();


    ctx.restore();

}


/* =========================================================
   SNAKE
========================================================= */

function drawSnake() {

    if (!snake.length) return;

    ctx.save();

    /*
     * Draw tail first.
     */
    ctx.lineCap = "round";
    ctx.lineJoin = "round";

    /*
     * Black snake shadow.
     */
    ctx.shadowColor =
        "rgba(0,0,0,0.9)";

    ctx.shadowBlur = 16;

    ctx.strokeStyle = "#000";

    ctx.lineWidth = 12;

    ctx.beginPath();

    for (
        let i = snake.length - 1;
        i >= 0;
        i--
    ) {

        const p = snake[i];

        if (
            i === snake.length - 1
        ) {

            ctx.moveTo(
                p.x,
                p.y
            );

        } else {

            ctx.lineTo(
                p.x,
                p.y
            );

        }

    }

    ctx.stroke();


    /*
     * Main black body.
     */
    ctx.shadowBlur = 0;

    ctx.strokeStyle = "#000";

    ctx.lineWidth = 8;

    ctx.beginPath();

    for (
        let i = snake.length - 1;
        i >= 0;
        i--
    ) {

        const p = snake[i];

        if (
            i === snake.length - 1
        ) {

            ctx.moveTo(
                p.x,
                p.y
            );

        } else {

            ctx.lineTo(
                p.x,
                p.y
            );

        }

    }

    ctx.stroke();


    /*
     * Head.
     */
    const head = snake[0];

    ctx.fillStyle = "#000";

    ctx.beginPath();

    ctx.arc(
        head.x,
        head.y,
        6,
        0,
        Math.PI * 2
    );

    ctx.fill();


    /*
     * Tiny dark eyes.
     * Kept subtle so snake remains black.
     */
    const eyeDistance = 3.2;

    const sideAngle =
        headAngle + Math.PI / 2;

    const forwardX =
        Math.cos(headAngle);

    const forwardY =
        Math.sin(headAngle);

    const sideX =
        Math.cos(sideAngle);

    const sideY =
        Math.sin(sideAngle);


    ctx.fillStyle = "#ffffff";

    ctx.globalAlpha = 0.75;

    ctx.beginPath();

    ctx.arc(
        head.x +
        forwardX * 3 +
        sideX * eyeDistance,

        head.y +
        forwardY * 3 +
        sideY * eyeDistance,

        0.8,

        0,
        Math.PI * 2
    );

    ctx.fill();


    ctx.beginPath();

    ctx.arc(
        head.x +
        forwardX * 3 -
        sideX * eyeDistance,

        head.y +
        forwardY * 3 -
        sideY * eyeDistance,

        0.8,

        0,
        Math.PI * 2
    );

    ctx.fill();


    ctx.restore();

}


/* =========================================================
   PARTICLES
========================================================= */

function drawParticles() {

    if (!particles.length) return;

    ctx.save();

    for (const p of particles) {

        ctx.globalAlpha =
            Math.max(
                0,
                p.life / p.maxLife
            );

        ctx.fillStyle = "#ffd700";

        ctx.shadowColor =
            "#ffd700";

        ctx.shadowBlur = 8;

        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,
            p.radius,
            0,
            Math.PI * 2
        );

        ctx.fill();

    }

    ctx.restore();

    ctx.globalAlpha = 1;

}


/* =========================================================
   POINTER INDICATOR
========================================================= */

function drawPointerIndicator() {

    if (
        !pointer.active ||
        gameState !== "playing"
    ) return;

    /*
     * Very subtle ring showing
     * where the snake is following.
     */
    ctx.save();

    ctx.globalAlpha = 0.08;

    ctx.strokeStyle = "#ffffff";

    ctx.lineWidth = 1;

    ctx.beginPath();

    ctx.arc(
        pointer.x,
        pointer.y,
        12,
        0,
        Math.PI * 2
    );

    ctx.stroke();

    ctx.restore();

}


/* =========================================================
   DRAW
========================================================= */

function draw() {

    drawBackground();

    drawGoldenBall();

    drawSnake();

    drawParticles();

    drawPointerIndicator();

}


/* =========================================================
   GAME LOOP
========================================================= */

function gameLoop(time) {

    const dt =
        Math.min(
            0.033,
            (time - lastTime) / 1000 || 0
        );

    lastTime = time;

    update(dt);

    draw();

    requestAnimationFrame(
        gameLoop
    );

}


/* =========================================================
   BUTTONS
========================================================= */

startBtn.addEventListener(
    "click",
    () => {

        startGame();

    }
);


againBtn.addEventListener(
    "click",
    () => {

        startGame();

    }
);


/* =========================================================
   MUTE
========================================================= */

muteBtn.addEventListener(
    "click",
    event => {

        event.stopPropagation();

        soundEnabled =
            !soundEnabled;

        muteBtn.textContent =
            soundEnabled
                ? "🔊"
                : "🔇";

        try {

            localStorage.setItem(
                "blackSnakeSound",
                soundEnabled ? "1" : "0"
            );

        } catch (error) {}

        if (soundEnabled) {

            initAudio();

            playTone(
                500,
                0.06,
                0,
                "sine",
                0.025
            );

        }

    }
);


/* =========================================================
   PREVENT MOBILE CONTEXT MENU
========================================================= */

canvas.addEventListener(
    "contextmenu",
    event => {
        event.preventDefault();
    }
);


/* =========================================================
   INITIALIZE
========================================================= */

resizeCanvas();

resetGame();

gameState = "menu";

requestAnimationFrame(
    gameLoop
);

})();
</script>
