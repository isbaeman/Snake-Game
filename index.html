<script>
"use strict";

/* =====================================================
   CANVAS
===================================================== */

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const lcd = document.querySelector(".lcd");

let canvasSize = 320;


/* =====================================================
   GRID
===================================================== */

/*
 * Classic Nokia-style logical grid.
 */
const GRID = 24;

let cellSize;


/* =====================================================
   GAME VARIABLES
===================================================== */

let snake = [];

let food = {
    x: 10,
    y: 10
};

let direction = {
    x: 1,
    y: 0
};

let nextDirection = {
    x: 1,
    y: 0
};

let score = 0;
let highScore = 0;

let level = 1;

let foodsEaten = 0;

let gameRunning = false;

let gameTimer = null;


/* =====================================================
   SPEED
===================================================== */

function getSpeed() {

    /*
     * Starts manageable and gets gradually faster.
     */
    return Math.max(
        75,
        145 - (level - 1) * 10
    );

}


/* =====================================================
   DOM
===================================================== */

const scoreElement =
    document.getElementById("score");

const highElement =
    document.getElementById("high");

const levelElement =
    document.getElementById("level");

const startOverlay =
    document.getElementById("startOverlay");

const gameOverOverlay =
    document.getElementById("gameOverOverlay");

const startButton =
    document.getElementById("startButton");

const restartButton =
    document.getElementById("restartButton");

const finalScore =
    document.getElementById("finalScore");

const finalHigh =
    document.getElementById("finalHigh");

const soundButton =
    document.getElementById("soundButton");


/* =====================================================
   LOCAL STORAGE
===================================================== */

try {

    highScore =
        Number(
            localStorage.getItem(
                "nokiaSnakeHighScore"
            )
        ) || 0;

} catch (error) {

    highScore = 0;

}

highElement.textContent =
    String(highScore).padStart(4, "0");


/* =====================================================
   AUDIO
===================================================== */

let audioContext = null;

let soundEnabled = true;

try {

    soundEnabled =
        localStorage.getItem(
            "nokiaSnakeSound"
        ) !== "off";

} catch (error) {}

function initializeAudio() {

    if (!soundEnabled) return;

    if (!audioContext) {

        const AudioContext =
            window.AudioContext ||
            window.webkitAudioContext;

        if (!AudioContext) return;

        audioContext =
            new AudioContext();

    }

    if (
        audioContext.state ===
        "suspended"
    ) {

        audioContext.resume();

    }

}


/* =====================================================
   EATING SOUND
===================================================== */

function playEatSound() {

    if (!soundEnabled) return;

    initializeAudio();

    if (!audioContext) return;

    const oscillator =
        audioContext.createOscillator();

    const gain =
        audioContext.createGain();

    oscillator.type = "square";

    oscillator.frequency.setValueAtTime(
        620,
        audioContext.currentTime
    );

    oscillator.frequency.exponentialRampToValueAtTime(
        900,
        audioContext.currentTime + 0.07
    );

    gain.gain.setValueAtTime(
        0.045,
        audioContext.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
        0.0001,
        audioContext.currentTime + 0.09
    );

    oscillator
        .connect(gain)
        .connect(audioContext.destination);

    oscillator.start();

    oscillator.stop(
        audioContext.currentTime + 0.1
    );

}


/* =====================================================
   START SOUND
===================================================== */

function playStartSound() {

    if (!soundEnabled) return;

    initializeAudio();

    if (!audioContext) return;

    const oscillator =
        audioContext.createOscillator();

    const gain =
        audioContext.createGain();

    oscillator.type = "square";

    oscillator.frequency.setValueAtTime(
        420,
        audioContext.currentTime
    );

    oscillator.frequency.setValueAtTime(
        650,
        audioContext.currentTime + 0.08
    );

    gain.gain.setValueAtTime(
        0.035,
        audioContext.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
        0.0001,
        audioContext.currentTime + 0.16
    );

    oscillator
        .connect(gain)
        .connect(audioContext.destination);

    oscillator.start();

    oscillator.stop(
        audioContext.currentTime + 0.17
    );

}


/* =====================================================
   GAME OVER SOUND
===================================================== */

function playGameOverSound() {

    if (!soundEnabled) return;

    initializeAudio();

    if (!audioContext) return;

    const oscillator =
        audioContext.createOscillator();

    const gain =
        audioContext.createGain();

    oscillator.type = "square";

    oscillator.frequency.setValueAtTime(
        400,
        audioContext.currentTime
    );

    oscillator.frequency.exponentialRampToValueAtTime(
        160,
        audioContext.currentTime + 0.25
    );

    gain.gain.setValueAtTime(
        0.04,
        audioContext.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
        0.0001,
        audioContext.currentTime + 0.28
    );

    oscillator
        .connect(gain)
        .connect(audioContext.destination);

    oscillator.start();

    oscillator.stop(
        audioContext.currentTime + 0.3
    );

}


/* =====================================================
   RESIZE
===================================================== */

function resizeCanvas() {

    const rect =
        lcd.getBoundingClientRect();

    canvasSize =
        Math.floor(
            Math.min(
                rect.width,
                rect.height
            )
        );

    const dpr =
        Math.min(
            window.devicePixelRatio || 1,
            2
        );

    canvas.width =
        canvasSize * dpr;

    canvas.height =
        canvasSize * dpr;

    canvas.style.width =
        canvasSize + "px";

    canvas.style.height =
        canvasSize + "px";

    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );

    cellSize =
        canvasSize / GRID;

    draw();

}

window.addEventListener(
    "resize",
    resizeCanvas
);


/* =====================================================
   RESET GAME
===================================================== */

function resetGame() {

    /*
     * EXTREMELY SMALL START.
     *
     * Only ONE segment.
     */
    const center =
        Math.floor(GRID / 2);

    snake = [

        {
            x: center,
            y: center
        }

    ];

    direction = {
        x: 1,
        y: 0
    };

    nextDirection = {
        x: 1,
        y: 0
    };

    score = 0;

    level = 1;

    foodsEaten = 0;

    placeFood();

    updateHUD();

    draw();

}


/* =====================================================
   START GAME
===================================================== */

function startGame() {

    initializeAudio();

    resetGame();

    gameRunning = true;

    startOverlay.classList.add(
        "hidden"
    );

    gameOverOverlay.classList.add(
        "hidden"
    );

    playStartSound();

    beginTimer();

}


/* =====================================================
   GAME TIMER
===================================================== */

function beginTimer() {

    clearInterval(gameTimer);

    gameTimer = setInterval(
        updateGame,
        getSpeed()
    );

}


/* =====================================================
   RESTART TIMER AFTER LEVEL CHANGE
===================================================== */

function refreshTimer() {

    if (!gameRunning) return;

    beginTimer();

}


/* =====================================================
   CHANGE DIRECTION
===================================================== */

function changeDirection(x, y) {

    /*
     * Prevent instant reversal.
     */
    if (
        x === -direction.x &&
        y === -direction.y
    ) {

        return;

    }

    /*
     * Also prevent two direction
     * commands from causing reversal
     * before the next movement step.
     */
    if (
        x === -nextDirection.x &&
        y === -nextDirection.y
    ) {

        return;

    }

    nextDirection = {
        x,
        y
    };

}


/* =====================================================
   POINTER DIRECTION
===================================================== */

/*
 * Mouse/finger does NOT directly move
 * the snake.
 *
 * It chooses the direction.
 *
 * The snake itself still moves
 * one grid cell per timer tick.
 */

function chooseDirectionFromPointer(
    clientX,
    clientY
) {

    if (!gameRunning) return;

    const rect =
        canvas.getBoundingClientRect();

    const pointerX =
        clientX - rect.left;

    const pointerY =
        clientY - rect.top;

    const head = snake[0];

    const headX =
        (head.x + 0.5) * cellSize;

    const headY =
        (head.y + 0.5) * cellSize;

    const dx =
        pointerX - headX;

    const dy =
        pointerY - headY;

    /*
     * Ignore tiny pointer movement
     * around the head.
     */
    if (
        Math.abs(dx) < 8 &&
        Math.abs(dy) < 8
    ) {

        return;

    }

    /*
     * Choose dominant axis.
     */
    if (
        Math.abs(dx) >
        Math.abs(dy)
    ) {

        if (dx > 0) {

            changeDirection(1, 0);

        } else {

            changeDirection(-1, 0);

        }

    } else {

        if (dy > 0) {

            changeDirection(0, 1);

        } else {

            changeDirection(0, -1);

        }

    }

}


/* =====================================================
   MOUSE
===================================================== */

canvas.addEventListener(
    "mousemove",
    event => {

        chooseDirectionFromPointer(
            event.clientX,
            event.clientY
        );

    }
);


/* =====================================================
   TOUCH
===================================================== */

canvas.addEventListener(
    "touchstart",
    event => {

        event.preventDefault();

        const touch =
            event.touches[0];

        if (!touch) return;

        chooseDirectionFromPointer(
            touch.clientX,
            touch.clientY
        );

    },
    {
        passive: false
    }
);


canvas.addEventListener(
    "touchmove",
    event => {

        event.preventDefault();

        const touch =
            event.touches[0];

        if (!touch) return;

        chooseDirectionFromPointer(
            touch.clientX,
            touch.clientY
        );

    },
    {
        passive: false
    }
);


/* =====================================================
   UPDATE GAME
===================================================== */

function updateGame() {

    if (!gameRunning) return;

    /*
     * Apply direction ONLY at the beginning
     * of a grid movement step.
     */
    direction = {
        ...nextDirection
    };

    const head = snake[0];

    const newHead = {

        x:
            head.x +
            direction.x,

        y:
            head.y +
            direction.y

    };


    /* WALL COLLISION */
    if (
        newHead.x < 0 ||
        newHead.x >= GRID ||
        newHead.y < 0 ||
        newHead.y >= GRID
    ) {

        endGame();

        return;

    }


    /* SELF COLLISION */
    const eating =
        newHead.x === food.x &&
        newHead.y === food.y;

    const bodyToCheck =
        eating
            ? snake
            : snake.slice(0, -1);

    if (
        bodyToCheck.some(
            segment =>
                segment.x === newHead.x &&
                segment.y === newHead.y
        )
    ) {

        endGame();

        return;

    }


    /*
     * Add exactly ONE new head.
     */
    snake.unshift(newHead);


    /* FOOD */
    if (eating) {

        eatFood();

    } else {

        /*
         * Normal movement:
         * remove exactly one tail segment.
         */
        snake.pop();

    }


    draw();

}


/* =====================================================
   EAT FOOD
===================================================== */

function eatFood() {

    /*
     * IMPORTANT:
     *
     * We do NOT pop the tail when food
     * is eaten.
     *
     * Therefore the snake becomes
     * exactly ONE segment longer.
     */

    score++;

    foodsEaten++;

    /*
     * LEVEL increases gradually.
     */
    level =
        Math.floor(
            foodsEaten / 5
        ) + 1;

    updateHighScore();

    updateHUD();

    /*
     * Sound happens immediately
     * on successful pickup.
     */
    playEatSound();

    /*
     * Generate new food only AFTER
     * successful eating.
     */
    placeFood();

    /*
     * Speed changes only when level changes.
     */
    refreshTimer();

}


/* =====================================================
   FOOD POSITION
===================================================== */

function placeFood() {

    let attempts = 0;

    do {

        food = {

            x:
                Math.floor(
                    Math.random() * GRID
                ),

            y:
                Math.floor(
                    Math.random() * GRID
                )

        };

        attempts++;

    } while (

        attempts < 500 &&

        snake.some(
            segment =>
                segment.x === food.x &&
                segment.y === food.y
        )

    );

}


/* =====================================================
   HIGH SCORE
===================================================== */

function updateHighScore() {

    if (score > highScore) {

        highScore = score;

        try {

            localStorage.setItem(
                "nokiaSnakeHighScore",
                String(highScore)
            );

        } catch (error) {}

    }

}


/* =====================================================
   HUD
===================================================== */

function updateHUD() {

    scoreElement.textContent =
        String(score).padStart(4, "0");

    highElement.textContent =
        String(highScore).padStart(4, "0");

    levelElement.textContent =
        String(level).padStart(2, "0");

}


/* =====================================================
   DRAW BACKGROUND
===================================================== */

function drawBackground() {

    ctx.fillStyle =
        "#9BBC0F";

    ctx.fillRect(
        0,
        0,
        canvasSize,
        canvasSize
    );


    /*
     * Very subtle LCD texture.
     */
    ctx.fillStyle =
        "rgba(15,56,15,.025)";

    for (
        let y = 0;
        y < canvasSize;
        y += 4
    ) {

        ctx.fillRect(
            0,
            y,
            canvasSize,
            1
        );

    }

}


/* =====================================================
   DRAW SNAKE
===================================================== */

function drawSnake() {

    /*
     * Draw every segment as a small pixel.
     *
     * Width/height NEVER increases.
     *
     * Only the NUMBER of segments increases.
     */

    for (
        let i = snake.length - 1;
        i >= 0;
        i--
    ) {

        const segment =
            snake[i];

        const padding =
            cellSize * 0.22;

        const size =
            cellSize -
            padding * 2;

        const x =
            segment.x * cellSize +
            padding;

        const y =
            segment.y * cellSize +
            padding;


        /*
         * Head is slightly different,
         * but remains pixel based.
         */
        if (i === 0) {

            ctx.fillStyle =
                "#0F380F";

            ctx.fillRect(
                x - 1,
                y - 1,
                size + 2,
                size + 2
            );

        } else {

            ctx.fillStyle =
                "#306230";

            ctx.fillRect(
                x,
                y,
                size,
                size
            );

        }

    }

}


/* =====================================================
   DRAW GOLDEN BALL
===================================================== */

function drawFood() {

    const centerX =
        (food.x + 0.5) *
        cellSize;

    const centerY =
        (food.y + 0.5) *
        cellSize;

    /*
     * Pixel-style golden ball.
     */
    const size =
        Math.max(
            4,
            cellSize * 0.48
        );

    ctx.fillStyle =
        "#5E4B00";

    ctx.fillRect(
        centerX - size / 2 - 1,
        centerY - size / 2 - 1,
        size + 2,
        size + 2
    );

    ctx.fillStyle =
        "#D7B800";

    ctx.fillRect(
        centerX - size / 2,
        centerY - size / 2,
        size,
        size
    );

    ctx.fillStyle =
        "#FFF1A0";

    const highlight =
        Math.max(
            1,
            size * 0.2
        );

    ctx.fillRect(
        centerX - size * 0.28,
        centerY - size * 0.28,
        highlight,
        highlight
    );

}


/* =====================================================
   DRAW
===================================================== */

function draw() {

    drawBackground();

    if (food) {

        drawFood();

    }

    drawSnake();

}


/* =====================================================
   GAME OVER
===================================================== */

function endGame() {

    gameRunning = false;

    clearInterval(gameTimer);

    updateHighScore();

    finalScore.textContent =
        String(score).padStart(4, "0");

    finalHigh.textContent =
        String(highScore).padStart(4, "0");

    updateHUD();

    gameOverOverlay.classList.remove(
        "hidden"
    );

    playGameOverSound();

}


/* =====================================================
   DIRECTION BUTTONS
===================================================== */

document
    .querySelectorAll(
        "[data-dir]"
    )
    .forEach(button => {

        button.addEventListener(
            "pointerdown",
            event => {

                event.preventDefault();

                initializeAudio();

                const dir =
                    button.dataset.dir;

                if (dir === "up") {

                    changeDirection(
                        0,
                        -1
                    );

                }

                if (dir === "down") {

                    changeDirection(
                        0,
                        1
                    );

                }

                if (dir === "left") {

                    changeDirection(
                        -1,
                        0
                    );

                }

                if (dir === "right") {

                    changeDirection(
                        1,
                        0
                    );

                }

            }
        );

    });


/* =====================================================
   START / RESTART
===================================================== */

startButton.addEventListener(
    "click",
    startGame
);

restartButton.addEventListener(
    "click",
    startGame
);


/* =====================================================
   SOUND BUTTON
===================================================== */

function updateSoundButton() {

    soundButton.textContent =
        soundEnabled
            ? "🔊 SOUND ON"
            : "🔇 SOUND OFF";

}

updateSoundButton();


soundButton.addEventListener(
    "click",
    () => {

        soundEnabled =
            !soundEnabled;

        try {

            localStorage.setItem(
                "nokiaSnakeSound",
                soundEnabled
                    ? "on"
                    : "off"
            );

        } catch (error) {}

        updateSoundButton();

        if (soundEnabled) {

            initializeAudio();

            playEatSound();

        }

    }
);


/* =====================================================
   INITIALIZE
===================================================== */

resizeCanvas();

resetGame();

</script>
